[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-reviewer"
version = "0.1.0"
description = "Agentic autonomous code review and vulnerability detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agentic-reviewer contributors" }]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "gitpython>=3.1.43",
    "PyGithub>=2.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "tree-sitter>=0.22.0",
    "networkx>=3.3",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
    "anyio>=4.4.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.32.0",
]

[project.scripts]
agentreview = "adapters.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "tools*", "indexer*", "adapters*", "ui*", "eval*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "core", "agents", "tools", "indexer", "adapters", "ui", "eval"]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","SIM","RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["core", "agents", "tools", "indexer", "adapters", "ui", "eval"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing --cov-report=html"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["tests/*", "*/__init__.py", "eval/*"]